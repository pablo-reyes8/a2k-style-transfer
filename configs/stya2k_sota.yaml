experiment:
  name: StyA2K_SOTA
  seed: 7
  output_dir: runs/stya2k_sota
  checkpoint_dir: checkpoints_sota
  sample_dir: samples_sota

model:
  device: cuda
  encoder:
    pretrained: true
  decoder:
    out_size: [256, 256]

loss:
  content_weight: 1.0
  style_weight: 6.0
  tv_weight: 1.0e-5
  moment_weight: 2.0
  style_layer_weights:
    relu1_1: 1.0
    relu2_1: 1.0
    relu3_1: 1.0
    relu4_1: 1.0
    relu5_1: 1.0

data:
  batch_size: 12
  num_workers: 4
  pin_memory: true
  drop_last: true
  final_size: 256
  content:
    hub_id: phiyodr/coco2017
    config: null
    split: train
    max_images: 12000
    random_resized_crop_scale: [0.55, 1.0]
    horizontal_flip: 0.5
  style:
    hub_id: davanstrien/wikiart-resized
    config: null
    split: train
    max_images: 18000
    random_resized_crop_scale: [0.75, 1.0]
    horizontal_flip: 0.25

optimizer:
  name: adam
  lr: 0.00008
  betas: [0.9, 0.999]
  weight_decay: 0.0

training:
  epochs: 50
  amp_enabled: true
  amp_dtype: bf16
  grad_clip: 1.0
  log_every: 50
  sample_every: 1
  save_every: 5
  resume_from: null
